name: Setup Android

description: Install JDK 17, Android SDK, NDK, and CMake for APK builds

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache NDK
      id: cache-ndk
      uses: actions/cache@v4
      with:
        path: /usr/local/lib/android/sdk/ndk/28.2.13676358
        key: ndk-28.2.13676358

    - name: Install NDK and CMake
      shell: bash
      run: |
        yes | sdkmanager --licenses >/dev/null || true
        sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        if [[ ! -d "${sdk}/ndk/28.2.13676358" ]]; then
          sdkmanager "ndk;28.2.13676358"
        else
          echo "NDK 28.2.13676358 restored from cache"
        fi
        sdkmanager "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"
        echo "ANDROID_HOME=${sdk}" >> "${GITHUB_ENV}"
        echo "ANDROID_NDK_HOME=${sdk}/ndk/28.2.13676358" >> "${GITHUB_ENV}"
        echo "ANDROID_NDK_ROOT=${sdk}/ndk/28.2.13676358" >> "${GITHUB_ENV}"

    - name: Write local.properties
      shell: bash
      run: |
        sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
        if [[ -z "${sdk}" ]]; then
          echo "ANDROID_SDK_ROOT is not set" >&2
          exit 1
        fi
        {
          printf 'sdk.dir=%s\n' "${sdk}"
        } > "${GITHUB_WORKSPACE}/local.properties"
        echo "Wrote local.properties (sdk.dir=${sdk})"
